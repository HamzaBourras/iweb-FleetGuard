version: '3.8'

services:
  # 1. La Base de données du site client
  db:
    image: mariadb:10.6
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: wordpress_db
      MYSQL_USER: wp_user
      MYSQL_PASSWORD: wp_password
    volumes:
      - db_data:/var/lib/mysql

  # 2. Le site WordPress Client (Apache + PHP intégrés)
  wordpress:
    depends_on:
      - db
    image: wordpress:latest
    restart: always
    ports:
      - "8080:80" # Le site sera accessible sur http://localhost:8080
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wp_user
      WORDPRESS_DB_PASSWORD: wp_password
      WORDPRESS_DB_NAME: wordpress_db
    volumes:
      # LIGNE CRUCIALE : Synchronise ton dossier local avec le conteneur en temps réel
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins

  # 3. L'outil pour gérer la base de données visuellement
  phpmyadmin:
    depends_on:
      - db
    image: phpmyadmin/phpmyadmin
    restart: always
    ports:
      - "8081:80" # Accessible sur http://localhost:8081
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root_password

# Déclaration du volume pour ne pas perdre la BDD si on éteint Docker
volumes:
  db_data: